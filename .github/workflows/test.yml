name: Testler (v2.0)

on:
  push:
  pull_request:

jobs:
  python-ve-sozlesme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Python bağımlılıkları
        run: pip install -r requirements.txt
      - name: Node bağımlılıkları
        working-directory: app
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Veri doğrulama
        run: python data/validate_dataset.py data/oturumlar.csv
      - name: Sentetik veri tekrarlanabilir mi
        run: |
          python data/generate_synthetic.py --cikti /tmp/sentetik.csv
          cmp /tmp/sentetik.csv data/sentetik.csv
      - name: pytest (birim, entegrasyon, TS↔Python sözleşmesi, ORT-web paritesi)
        run: python -m pytest -q tests
      - name: Tip denetimi ve derleme
        working-directory: app
        run: npm run lint && npm run build

  cypress:
    runs-on: ubuntu-latest
    needs: python-ve-sozlesme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - name: Cypress (v1 regresyon + v2.0 adaptif, model, parite, veri)
        uses: cypress-io/github-action@v6
        with:
          working-directory: app
          install: false
          start: npm run dev
          wait-on: 'http://localhost:3000'
          spec: |
            cypress/e2e/yollar.cy.js
            cypress/e2e/kabul.cy.js
            cypress/e2e/adaptif.cy.js
            cypress/e2e/model.cy.js
            cypress/e2e/parite.cy.js
            cypress/e2e/veri.cy.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videolari
          path: app/cypress/videos
