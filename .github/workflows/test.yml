name: Testler (v2.0)

on:
  push:
  pull_request:

jobs:
  python-ve-sozlesme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Python bağımlılıkları
        run: pip install -r requirements.txt
      - name: Node bağımlılıkları
        working-directory: app
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Veri doğrulama
        run: python data/validate_dataset.py data/oturumlar.csv
      - name: Sentetik veri tekrarlanabilir mi
        run: |
          python data/generate_synthetic.py --cikti /tmp/sentetik.csv
          cmp /tmp/sentetik.csv data/sentetik.csv
      - name: pytest (birim, entegrasyon, TS↔Python sözleşmesi, ORT-web paritesi)
        run: python -m pytest -q tests
      - name: Tip denetimi ve derleme
        working-directory: app
        run: npm run lint && npm run build

  tarayici-e2e:
    # Cypress senaryolarının puppeteer portları + veri hattı; sistem Chrome'u ile (sahte çıkarım yok).
    runs-on: ubuntu-latest
    needs: python-ve-sozlesme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - name: Uygulama bağımlılıkları
        working-directory: app
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Tarayıcı test bağımlılıkları
        working-directory: tools/browser-e2e
        run: npm ci --omit=optional
      - name: Dev sunucusu, tüm paketler (v1 regresyon, adaptif, model, parite, veri, veri hattı)
        working-directory: tools/browser-e2e
        run: CHROME_PATH="$(which google-chrome)" ./with-server.sh node run.mjs
      - name: Üretim derlemesi (dist/), parite + adaptif + model
        working-directory: tools/browser-e2e
        run: PROD=1 CHROME_PATH="$(which google-chrome)" ./with-server.sh node run.mjs parite adaptif model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarayici-e2e-sonuclari
          path: tools/browser-e2e/sonuclar.json

  cypress:
    # Cypress dosyalarının kendisi. Geliştirme ortamında Cypress ikilisi indirilemediği için ilk kez burada koşar.
    # Üretim derlemesine karşı koşar: Vite dev sunucusunun bağımlılık optimizasyonu sırasında sayfayı yeniden
    # yüklemesi ilk testi kararsız yapabilir; dist/ ise GitHub Pages'a gidenle aynıdır.
    runs-on: ubuntu-latest
    needs: python-ve-sozlesme
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Bağımlılıklar (Cypress ikilisi dahil)
        working-directory: app
        run: npm ci
      - name: Üretim derlemesi (model ve ORT WASM dosyaları dist/ içine kopyalanır)
        working-directory: app
        run: npm run build
      - name: Cypress (v1 regresyon + v2.0 adaptif, model, parite, sınır paritesi, veri)
        uses: cypress-io/github-action@v6
        with:
          working-directory: app
          install: false
          start: npm run serve:prod
          wait-on: 'http://localhost:3000/model/config.json'
          wait-on-timeout: 120
          browser: electron
          spec: |
            cypress/e2e/yollar.cy.js
            cypress/e2e/kabul.cy.js
            cypress/e2e/adaptif.cy.js
            cypress/e2e/model.cy.js
            cypress/e2e/parite.cy.js
            cypress/e2e/veri.cy.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videolari
          path: app/cypress/videos
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-hata-ekran-goruntuleri
          path: app/cypress/screenshots
          if-no-files-found: ignore
